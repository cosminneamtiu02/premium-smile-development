# .github/dependabot.yml
# Enforces brief §3's version policy mechanically (tightened 2026-07-31):
#   - majors AND minors are IGNORED (never even proposed)
#   - patches arrive as one grouped weekly PR into develop
#   - NO automerge: you review, checks pass, you merge.
# Security fixes that ship only in a minor won't get a PR — the Security tab
# still alerts; bumping that minor is a deliberate manual decision.

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Bucharest
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      patches:
        applies-to: version-updates
        update-types: [patch]
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # CI actions carve-out (owner decision 2026-08-01, brief §15.9): unlike npm,
  # actions CANNOT alter the built site — pinning them buys no determinism, and
  # stale majors accumulate runner-deprecation risk. Majors allowed, one grouped
  # weekly PR, still no automerge.
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Bucharest
    labels: [dependencies]
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
