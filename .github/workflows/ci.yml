# .github/workflows/ci.yml
# Fast lane: every PR into develop or blog, and pushes to either.
# Pixel/visual tests deliberately NOT here — they run locally (native) in the
# dev loop before commits and are re-verified by release.yml before main.
#
# `blog` is the long-lived branch the blog is built on (CLAUDE.md §15.39): its
# lanes and its syncs from develop are PRs into it, so they get the same gate a
# PR into develop gets. A PR's workflow file is read from the PR's merge
# commit, so this list reaches blog the moment it is merged there — develop
# learns it when the blog lands.

name: CI

on:
  pull_request:
    branches: [develop, blog]
  push:
    branches: [develop, blog]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Tests · Builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Playwright ⇄ container-tag lockstep check
        run: |
          [ -f package.json ] || { echo "no package.json yet (pre-Phase 0) — skipping"; exit 0; }
          PW=$(node -p "const d=require('./package.json').devDependencies||{};String(d['@playwright/test']||d.playwright||'').replace(/[~^]/,'')")
          [ -n "$PW" ] || { echo "playwright not a dependency yet — skipping"; exit 0; }
          for f in .github/workflows/release.yml .github/workflows/visual-baseline.yml; do
            grep -q "playwright:v${PW}-" "$f" || { echo "::error::${f}: container tag out of lockstep with playwright ${PW} in package.json — bump the tag in the same PR (GITHUB_SETUP §7)"; exit 1; }
          done

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # Node 24 LTS per brief §3
          cache: npm

      - name: Install (lockfile is truth)
        run: npm ci

      - name: Lint (ESLint incl. jsx-a11y) + format check
        run: |
          npm run lint
          npx prettier --check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Browser for component tests
        run: npx playwright install chromium --with-deps

      - name: Unit / interaction / story a11y tests (Vitest)
        run: npm run test -- --run

      - name: Storybook builds
        run: npm run build-storybook

      - name: Site builds (static export)
        run: npm run build

      - name: The blog exists in every language — its list and its articles (CLAUDE.md §5, §15.39 rounds 3 and 4)
        # Since round 3 (2026-10-14) every page of the list is written in
        # every language the [locale] layout generates, and since 2026-10-15
        # every ARTICLE too (lib/blog-article's EVERY LANGUAGE, IN ONE FILE).
        # Page 1 inherits the five locales and is asserted for all five. The
        # NUMBERED pages and the ARTICLES are the multiplied ones — their
        # generateStaticParams return the page or the slug alone, and Next
        # multiplies it by the layout's locales — so a change to that
        # multiplication would drop languages there silently: every numbered
        # page and every article Romanian has must exist in the other four.
        # The numbered route always writes at least one page (lib/blog's
        # numberedPages: page 1 again for a blog of six posts or fewer), and
        # lib/blog-article ships at least one article (an empty registry fails
        # the build: the export refuses an empty generateStaticParams). Whether
        # the pages' links work is the link check's below: its crawl from /
        # reaches every language's list through the bar's „Blog" and follows
        # each pager.
        run: |
          for l in ro en de fr it; do
            if [ ! -f "out/$l/blog/index.html" ]; then
              echo "::error::out/$l/blog/index.html is missing — the blog exists in every language"
              exit 1
            fi
          done
          shopt -s nullglob
          numbered=(out/ro/blog/page/*/index.html)
          if [ ${#numbered[@]} -eq 0 ]; then
            echo "::error::out/ro/blog/page/ holds no page — the numbered route always writes one (lib/blog's numberedPages)"
            exit 1
          fi
          # Every directory of out/ro/blog/ with a page of its own is an
          # article — the list's own pages are page 1 (out/ro/blog/index.html)
          # and out/ro/blog/page/<n>/, whose page/ holds no index.html itself.
          articles=(out/ro/blog/*/index.html)
          if [ ${#articles[@]} -eq 0 ]; then
            echo "::error::out/ro/blog/ holds no article page — lib/blog-article ships at least one (an empty registry fails the build)"
            exit 1
          fi
          for page in "${numbered[@]}" "${articles[@]}"; do
            rel="${page#out/ro/}"
            for l in en de fr it; do
              if [ ! -f "out/$l/$rel" ]; then
                echo "::error::out/$l/$rel is missing — out/ro/$rel exists, and every page of the blog exists in every language"
                exit 1
              fi
            done
          done

      - name: Internal link & hreflang check on the export
        # The ROOT-served shape, through the same tool release.yml runs on the
        # Pages shape (tools/check-export-links.mjs — linkinator, the ~pinned
        # devDependency, over out/ served by tools/serve-static.mjs; it also
        # reads CSS url()s and the 404 dispatcher's links). Off-site links are
        # skipped there: a bare "^https?://" once skipped EVERY link and the
        # crawl scanned nothing (found 2026-08-24).
        run: node tools/check-export-links.mjs

      - name: Upload Storybook (debug artifact, 3 days)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 3

      - name: Upload test failure screenshots (debug artifact, 3 days)
        # The components project saves a screenshot of each failing browser test
        # under .vitest-attachments (vitest.config.ts's screenshotDirectory). A
        # failure only Linux shows cannot be reproduced on a Mac, so CI keeps
        # them (added 2026-10-15, after PR #166's Linux-only failures).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-attachments
          path: .vitest-attachments
          retention-days: 3
          if-no-files-found: ignore

  deploy-staging:
    name: Deploy staging (placeholder until host confirmed)
    # develop only: the `development` environment's deployment rule allows
    # develop alone, so a push to blog would fail here — and staging shows what
    # the next release holds, which the blog does not until it lands.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: quality
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build with staging flag (forces noindex + robots disallow)
        run: STAGING=1 npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site-staging
          path: out
          retention-days: 7
      # ─────────────────────────────────────────────────────────────
      # DEPLOY PLACEHOLDER — staging host step goes here once hosting
      # is confirmed (production is NOT GitHub Pages per owner decision;
      # recommended: Cloudflare Pages). Token lives in the 'development'
      # GitHub Environment.
      # ─────────────────────────────────────────────────────────────
