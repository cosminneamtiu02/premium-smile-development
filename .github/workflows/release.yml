# .github/workflows/release.yml
# Slow lane, two triggers:
#   1) PR develop -> main  = the release gate: everything CI does PLUS the full
#      visual suite, inside the pinned Playwright image, comparing the LINUX
#      baseline set (maintained by visual-baseline.yml), so unverified visual
#      changes can never reach production unnoticed.
#   2) push to main        = production build; deploy step is a placeholder
#      until the hosting provider is chosen (brief §15.2).
#
# NOTE: the container tag below must stay in lockstep with the playwright
# version in package.json. Dependabot bumps the npm side; bump this tag in the
# same PR.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Full gate incl. visual regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      # PRs into main are promotions from develop, full stop (GITHUB_SETUP §2,
      # amended 2026-08-02). Any other source branch fails the required check
      # immediately — which makes its merge button unusable.
      - name: Guard — promotions come only from develop
        if: github.head_ref != 'develop'
        run: |
          echo "::error::PRs into main must originate from develop — this one is from '${{ github.head_ref }}'."
          exit 1

      - uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Lint + format + types
        run: |
          npm run lint
          npx prettier --check .
          npx tsc --noEmit

      - name: Unit / interaction / story a11y tests
        run: npm run test -- --run

      - name: Build Storybook
        run: npm run build-storybook

      - name: Visual regression (linux baseline set)
        run: npm run visual

      - name: Stale-baseline hint
        if: failure()
        run: echo "::notice::If the visual diffs are INTENTIONAL, the linux baseline set is stale — run the 'Visual baselines (linux set)' workflow on develop and update this PR (GITHUB_SETUP §7)."

      - name: Build site + link check
        run: |
          npm run build
          # linkinator serves out/ over http://localhost, so a bare "^https?://" skipped EVERY link and the crawl scanned nothing (found 2026-08-24)
          npx linkinator out --recurse --skip "^https?://(?!localhost|127\.0\.0\.1)" --verbosity error

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: playwright-report
          retention-days: 7

  build-production:
    name: Production build (interim GitHub Pages)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Interim Pages hosting (§15.2 amended 2026-08-02): the project site
      # lives under /<repo>/, and the github.io copy stays noindex until the
      # clinic's real domain is attached. Both vars vanish at the launch-host
      # switch (Cloudflare Pages remains the launch recommendation).
      PAGES_BASE_PATH: /premium-smile-development
      NOINDEX: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload production export (rollback record)
        uses: actions/upload-artifact@v7
        with:
          name: site-production
          path: out
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy-production:
    name: Deploy to GitHub Pages (approval-gated)
    if: github.event_name == 'push'
    needs: build-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # The production environment's required reviewer IS the go-live click
    # (GITHUB_SETUP §3) — the gate sits here, on the actual deployment, not on
    # the compile.
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
