# .github/workflows/release.yml
# Slow lane, two triggers:
#   1) PR develop -> main  = the release gate: everything CI does PLUS the full
#      visual suite, inside the pinned Playwright image, comparing the LINUX
#      baseline set (maintained by visual-baseline.yml), so unverified visual
#      changes can never reach production unnoticed.
#   2) push to main        = production build, link-checked under its base
#      path, then deployed to the interim GitHub Pages host behind the
#      production environment's approval (brief §15.2, amended 2026-08-02).
#
# NOTE: the container tag below must stay in lockstep with the playwright
# version in package.json. Dependabot bumps the npm side; bump this tag in the
# same PR.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Full gate incl. visual regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      # PRs into main are promotions from develop, full stop (GITHUB_SETUP §2,
      # amended 2026-08-02). Any other source branch fails the required check
      # immediately — which makes its merge button unusable.
      - name: Guard — promotions come only from develop
        if: github.head_ref != 'develop'
        run: |
          echo "::error::PRs into main must originate from develop — this one is from '${{ github.head_ref }}'."
          exit 1

      - uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Lint + format + types
        run: |
          npm run lint
          npx prettier --check .
          npx tsc --noEmit

      - name: Unit / interaction / story a11y tests
        run: npm run test -- --run

      - name: Build Storybook
        run: npm run build-storybook

      - name: Visual regression (linux baseline set)
        run: npm run visual

      - name: Stale-baseline hint
        if: failure()
        run: echo "::notice::If the visual diffs are INTENTIONAL, the linux baseline set is stale — run the 'Visual baselines (linux set)' workflow on develop and update this PR (GITHUB_SETUP §7)."

      # The export this gate checks is the one production DEPLOYS — the interim
      # Pages shape, under its base path — crawled the way github.io serves it
      # (tools/check-export-links.mjs), so a URL that forgot the prefix fails
      # HERE and not on the live site: on 2026-10-03 every picture 404'd on a
      # Pages-shaped build while the root-served crawl stayed green
      # (pages-base-path lane, CLAUDE.md §15.2). The root shape is ci.yml's
      # crawl, on the same develop commit. STEP-level env on purpose: built
      # with the prefix, Storybook would move every story's picture and the
      # visual suite above would fail on nothing.
      - name: Build site (production shape) + link check as Pages serves it
        env:
          PAGES_BASE_PATH: /premium-smile-development
          NOINDEX: '1'
        run: |
          npm run build
          node tools/check-export-links.mjs

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: playwright-report
          retention-days: 7

  build-production:
    name: Production build (interim GitHub Pages)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Interim Pages hosting (§15.2 amended 2026-08-02): the project site
      # lives under /<repo>/, and the github.io copy stays noindex until the
      # clinic's real domain is attached. Both vars vanish at the launch-host
      # switch (Cloudflare Pages remains the launch recommendation).
      PAGES_BASE_PATH: /premium-smile-development
      NOINDEX: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The exact artifact about to deploy, crawled under its base path the way
      # github.io will serve it — a broken export never reaches the approval
      # click (pages-base-path lane, 2026-10-03).
      - name: Link check as Pages serves it
        run: node tools/check-export-links.mjs
      - name: Upload production export (rollback record)
        uses: actions/upload-artifact@v7
        with:
          name: site-production
          path: out
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy-production:
    name: Deploy to GitHub Pages (approval-gated)
    if: github.event_name == 'push'
    needs: build-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # The production environment's required reviewer IS the go-live click
    # (GITHUB_SETUP §3) — the gate sits here, on the actual deployment, not on
    # the compile.
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
