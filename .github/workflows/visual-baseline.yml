# .github/workflows/visual-baseline.yml
# Regenerates the LINUX pixel-baseline set inside the same pinned Playwright
# container the release gate uses.
#
# Owner decision 2026-07-31 (recorded in CLAUDE.md §15.7): no Docker on the
# development machine. Local `npm run visual` compares the native darwin set
# (the pre-commit cross-component regression net); CI compares the linux set.
# Playwright's platform-suffixed snapshots (…-darwin.png / …-linux.png) let
# both sets coexist in the repo.
#
# Trigger manually (Actions tab) on the branch whose baselines should refresh —
# at latest before each develop -> main promotion, whenever intentional visual
# changes have accumulated.
#
# NOTE: keep the container tag in lockstep with the playwright version in
# package.json (same rule as release.yml).

name: Visual baselines (linux set)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-linux-baselines:
    name: Regenerate + commit linux snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Mark workspace safe for git inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Regenerate linux baselines
        run: npm run visual:update

      # Direct pushes to develop are rejected by its required status check
      # (protection applied 2026-08-01) — so the refresh is DELIVERED AS A PR:
      # CI runs on it, the owner reviews the PNG diffs and merges. No [skip ci]
      # on purpose. The pinned container has no gh CLI; the PR is opened via
      # the REST API with Node's fetch.
      - name: Deliver refreshed linux snapshots as a PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*-linux.png'
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          BRANCH="chore/linux-baselines-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore(visual): refresh linux baseline set"
          git push -u origin "$BRANCH"
          export BRANCH
          node -e '
            const body = {
              title: "chore(visual): refresh linux baseline set",
              head: process.env.BRANCH,
              base: process.env.BASE,
              body: "Automated refresh from the pinned Playwright container (GITHUB_SETUP §7). Review the PNG diffs, wait for CI, merge. Generated by run " + process.env.GITHUB_RUN_ID + ".",
            };
            fetch(process.env.GITHUB_API_URL + "/repos/" + process.env.GITHUB_REPOSITORY + "/pulls", {
              method: "POST",
              headers: {
                authorization: "Bearer " + process.env.GH_TOKEN,
                accept: "application/vnd.github+json",
                "content-type": "application/json",
              },
              body: JSON.stringify(body),
            }).then(async (r) => {
              const text = await r.text();
              if (!r.ok) { console.error(r.status, text); process.exit(1); }
              console.log("PR opened:", JSON.parse(text).html_url);
            });
          '
